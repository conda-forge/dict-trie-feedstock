{% set name = "dict-trie" %}
{% set version = "1.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/dict-trie-{{ version }}.tar.gz
  sha256: f201be32eea4a2239c1c31a0f738ad1bbb073a0bc738572606f4be5088e54ca7

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - dict_trie
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://dict-trie.readthedocs.io/en/latest/
  dev_url: https://github.com/jfjlaros/dict-trie
  summary: Trie implementation for approximate string matching.
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - acaprez
